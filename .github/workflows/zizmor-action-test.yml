name: zizmor test (B — zizmor-action)

# Eval caller for OPTION B: the upstream zizmorcore/zizmor-action.
# Uploads SARIF to Code Scanning by default (advanced-security: true).
# The action does NOT fail on findings, so this is naturally non-blocking.
# See docs/zizmor-eval/ for the comparison.

on:
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # SARIF upload to Code Scanning
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          min-severity: low
          min-confidence: low
